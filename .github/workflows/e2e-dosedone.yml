name: E2E (dosedone) — emulator + Maestro

# Per-app device testing: builds a debug APK from the Expo project,
# boots an Android emulator on the GitHub runner, installs the APK,
# runs the Maestro smoke flow (with screenshots), uploads screenshots.
# No Firebase billing needed.
#
# DISK BUDGET (modeled upfront — never wall-by-wall):
#   runner ~14 GB free. npm ci ~1.5 + Gradle cold ~2 + system image ~3.5
#   + Maestro ~0.2 + emulator userdata 2 (capped via -partition-size 2048)
#   + APK ~0.1 ≈ 9.3 GB. Toolchain pre-clean keeps headroom.

on:
  push:
    paths:
      - 'apps/dosedone/**'
      - '.github/workflows/e2e-dosedone.yml'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (pre-build)
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/share/powershell /usr/share/swift 2>/dev/null || true
          sudo rm -rf /usr/local/lib/android/sdk/ndk 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true
          df -h / | tail -1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/dosedone/app/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: apps/dosedone/app
        run: npm ci

      - name: Prebuild Android project
        working-directory: apps/dosedone/app
        run: npx expo prebuild --platform android --clean
        env:
          CI: 'true'

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/transforms-4
            ~/.gradle/wrapper
          key: gradle-dosedone-${{ runner.os }}-${{ hashFiles('apps/dosedone/app/package-lock.json') }}
          restore-keys: |
            gradle-dosedone-${{ runner.os }}-

      - name: Build debug APK
        working-directory: apps/dosedone/app/android
        run: ./gradlew assembleDebug --no-daemon

      # The Gradle build leaves the runner nearly full — reclaim space
      # BEFORE the emulator/system-image download, not after it fails.
      - name: Free disk space (post-build)
        run: |
          sudo docker image prune --all --force 2>/dev/null || true
          df -h / | tail -1

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run Maestro smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -partition-size 2048 -no-snapshot -no-audio -no-boot-anim
          script: |
            cd "$GITHUB_WORKSPACE/apps/dosedone"
            mkdir -p screenshots
            adb install -r app/android/app/build/outputs/apk/debug/app-debug.apk
            maestro test .maestro/smoke.yaml

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-dosedone
          path: apps/dosedone/screenshots/
          if-no-files-found: warn
