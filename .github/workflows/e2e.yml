name: E2E (emulator + Maestro)

# Automated device testing on every push to main — no Firebase billing needed.
# Builds a debug APK from the Expo managed project, boots an Android emulator
# on the GitHub runner, installs the APK and runs the Maestro smoke flow.

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.maestro/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Prebuild Android project
        working-directory: app
        run: npx expo prebuild --platform android --clean
        env:
          CI: 'true'

      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run Maestro smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            adb install -r app/android/app/build/outputs/apk/debug/app-debug.apk
            maestro test .maestro/smoke.yaml
