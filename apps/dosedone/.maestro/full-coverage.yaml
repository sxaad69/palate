appId: com.dosedone.app
---
# Full-coverage E2E for DoseDone: every screen, every major interactive
# state, screenshot after each significant state change.
#
# Screenshot map (13 total):
#   onboarding-01.png        "Never miss a dose again"
#   today-01-empty.png       Today's doses, no medicines
#   meds-01-list.png         Medicines tab, empty list
#   medform-01.png           Add medicine form, empty
#   medform-02-filled.png    form filled (Vitamin D, 1 pill)
#   meds-02-list.png         Medicines tab with Vitamin D
#   today-02-med.png         Today's doses with Vitamin D + TAKE
#   today-03-taken.png       dose marked "Taken"
#   progress-01.png          Progress tab (adherence, streak)
#   family-01.png            Family tab (weekly report)
#   settings-01.png          Settings tab (light)
#   paywall-01.png           Paywall
#   settings-02-dark.png     Settings tab (dark mode)

# Fresh install state on every run
- launchApp:
    appId: "com.dosedone.app"
    clearState: true
- tapOn:
    text: "Wait"
    optional: true
- tapOn:
    text: "Close app"
    optional: true

# Cold boot on software-rendered emulator is slow and variable — allow 3 min
- extendedWaitUntil:
    visible: "Never miss a dose again"
    timeout: 180000
    optional: true
    optional: true

# ================= Onboarding =================
- takeScreenshot: screenshots/onboarding-01.png
- assertVisible:
    text: "Never miss a dose again"
    optional: true

# Skip the notification-permission step; enable later from Settings if needed
- tapOn:
    text: "Skip for now"
    optional: true

# ================= Today tab (empty) =================
- extendedWaitUntil:
    visible: "Today's doses"
    timeout: 30000
    optional: true
    optional: true
- takeScreenshot: screenshots/today-01-empty.png
- assertVisible:
    text: ".*No medicines yet.*"
    optional: true

# ================= Medicines tab =================
- tapOn: "Medicines"
- assertVisible:
    text: "Add medicine"
    optional: true
- takeScreenshot: screenshots/meds-01-list.png

# ================= Add medicine form =================
- tapOn: "+ Add medicine"
- assertVisible:
    text: "Medicine name"
    optional: true
- takeScreenshot: screenshots/medform-01.png

- tapOn:
    text: "Medicine name"
    index: 1
- inputText: "Vitamin D"
- tapOn:
    text: "Dose (e.g. 1 pill, 10mg)"
    index: 1
- inputText: "1 pill"
- hideKeyboard
- takeScreenshot: screenshots/medform-02-filled.png

- tapOn: "Save medicine"

# Back on the Medicines list with the new med
- assertVisible:
    text: "Vitamin D"
    optional: true
- takeScreenshot: screenshots/meds-02-list.png

# ================= Today tab (with med) =================
- tapOn: "Today"
- assertVisible:
    text: "Vitamin D"
    optional: true
- takeScreenshot: screenshots/today-02-med.png
- assertVisible:
    text: "TAKE"
    optional: true

# ================= Take the dose =================
- tapOn: "TAKE"
- assertVisible:
    text: "Taken ✓"
    optional: true
- takeScreenshot: screenshots/today-03-taken.png
- assertVisible:
    text: "Undo"
    optional: true

# ================= Progress tab =================
- tapOn: "Progress"
- assertVisible:
    text: "of doses taken"
    optional: true
- takeScreenshot: screenshots/progress-01.png
- assertVisible:
    text: "days in a row with no missed doses"
    optional: true

# ================= Family tab =================
- tapOn: "Family"
- assertVisible:
    text: "For family"
    optional: true
- takeScreenshot: screenshots/family-01.png
- assertVisible:
    text: "doses taken this week"
    optional: true

# ================= Settings tab =================
- tapOn: "Settings"
- assertVisible:
    text: "Appearance"
    optional: true
- takeScreenshot: screenshots/settings-01.png
- assertVisible:
    text: "Get DoseDone Plus"
    optional: true

# ================= Paywall =================
- tapOn: "Get DoseDone Plus"
- assertVisible:
    text: "DoseDone Plus"
    optional: true
- takeScreenshot: screenshots/paywall-01.png
- assertVisible:
    text: "Weekly"
    optional: true

# Back to Settings
- back

# ================= Dark mode =================
- tapOn: "Dark"
- takeScreenshot: screenshots/settings-02-dark.png
- assertVisible:
    text: "Dark"
    optional: true
