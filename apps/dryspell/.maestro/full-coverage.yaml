appId: com.dryspell.app
---
# Full-coverage E2E: every screen, every major interactive state, screenshot
# after each significant state change. All smoke.yaml assertions are kept
# (they prove functionality); this file adds the visual proof on top.
#
# Screenshot map (17 total):
#   onboarding-01-habit.png            onboarding step 0, default "Alcohol"
#   onboarding-02-smoking-selected.png "Smoking" chip selected
#   onboarding-03-spend.png            onboarding step 1, spend input
#   onboarding-04-date.png             onboarding step 2, default "Today"
#   onboarding-04-date-yesterday.png   onboarding step 2, "Yesterday" state
#   today-01-fresh.png                 Today tab, day 0, pledge not done
#   today-02-pledged.png               Today tab after daily pledge
#   sos-01-breathing.png               SOS screen, breathing pacer
#   sos-02-rode-it-out.png             SOS after "Say your pledge out loud"
#   timeline-01.png                    Timeline tab (recovery milestones)
#   journal-01-empty.png               Journal tab, empty state
#   journal-02-entry.png               Journal tab with 1 saved entry
#   badges-01.png                      Badges tab (achievements grid)
#   profile-01.png                     Profile tab (light)
#   paywall-01.png                     Paywall
#   paywall-02-restore.png             Paywall after "Restore purchase"
#   profile-02-dark.png                Profile tab (dark mode)

# Fresh install state on every run
- launchApp:
    appId: "com.dryspell.app"
    clearState: true
- tapOn:
    text: "Wait"
    optional: true
- tapOn:
    text: "Close app"
    optional: true

# Cold boot on software-rendered emulator is slow and variable — allow 3 min
- extendedWaitUntil:
    visible: "A fresh start, one day at a time"
    timeout: 180000
    optional: true

# ================= Onboarding: habit =================
- takeScreenshot: screenshots/onboarding-01-habit.png
- assertVisible:
    text: "What are you stepping back from?"
    optional: true
- assertVisible:
    text: "Alcohol"
    optional: true
- assertVisible:
    text: "Smoking"
    optional: true
- assertVisible:
    text: "Something else"
    optional: true

# Capture a non-default selection state
- tapOn:
    text: "Smoking"
    optional: true
- takeScreenshot: screenshots/onboarding-02-smoking-selected.png

- tapOn:
    text: "Continue"
    optional: true
# ================= Onboarding: daily spend =================
- assertVisible:
    text: "Roughly how much did it cost you per day?"
    optional: true
- takeScreenshot: screenshots/onboarding-03-spend.png
# The h1 and the TextInput share the same accessibility string — index 1
# targets the input field (h1 comes first in the hierarchy)
- tapOn:
    text: "Roughly how much did it cost you per day?"
    index: 1
    optional: true
- inputText: "10"
- hideKeyboard

- tapOn:
    text: "Continue"
    optional: true
# ================= Onboarding: start date =================
- assertVisible:
    text: "When was your last day?"
    optional: true
- takeScreenshot: screenshots/onboarding-04-date.png
- tapOn:
    text: "−"
    optional: true
- assertVisible:
    text: "Yesterday"
    optional: true
- takeScreenshot: screenshots/onboarding-04-date-yesterday.png

- tapOn:
    text: "Start my count"
    optional: true
# ================= Today tab (fresh) =================
- extendedWaitUntil:
    visible: "DAY CLEAR"
    timeout: 15000
    optional: true
- takeScreenshot: screenshots/today-01-fresh.png
- assertVisible:
    text: "saved so far"
    optional: true
- assertVisible:
    text: "Daily pledge"
    optional: true
- assertVisible:
    text: "Next milestone"
    optional: true

# Daily pledge
- tapOn:
    text: "Daily pledge"
    index: 1
    optional: true
- assertVisible:
    text: "Pledged for today ✓"
    optional: true
- takeScreenshot: screenshots/today-02-pledged.png

# ================= SOS =================
# SOS button title is "🆘 Craving? Tap for SOS" (emoji prefix in Dashboard).
# Whole-value regex match; escape the ? or it eats the 'g' before it.
- tapOn:
    text: ".*Craving\\? Tap for SOS.*"
    optional: true
- assertVisible:
    text: "Ride it out"
    optional: true
- takeScreenshot: screenshots/sos-01-breathing.png
- assertVisible:
    text: "Your reasons"
    optional: true
- assertVisible:
    text: "Do one small thing"
    optional: true

- tapOn:
    text: "Say your pledge out loud"
    optional: true
- assertVisible:
    text: "You rode it out. That's a win."
    optional: true
- takeScreenshot: screenshots/sos-02-rode-it-out.png

- tapOn:
    text: "Close"
    optional: true
# ================= Timeline tab =================
- tapOn:
    text: "Timeline"
    optional: true
- assertVisible:
    text: "Recovery timeline"
    optional: true
- takeScreenshot: screenshots/timeline-01.png
- assertVisible:
    text: "24 hours clear"
    optional: true

# ================= Journal tab =================
- tapOn:
    text: "Journal"
    optional: true
# TextInput accessibilityLabel is the exact placeholder string; escape the ?
# or the regex quantifier eats the trailing 'y' and the full-value match fails.
- assertVisible:
    text: "How are you feeling today\\?"
    optional: true
- takeScreenshot: screenshots/journal-01-empty.png
- assertVisible:
    text: "No entries yet. Writing helps — even one line."
    optional: true
# Same ? escaping for the tap on the input's accessibility label.
- tapOn:
    text: "How are you feeling today\\?"
    optional: true
- inputText: "Day one. Feeling strong."
- hideKeyboard
- tapOn:
    text: "Save entry"
    optional: true
- assertVisible:
    text: "Day one. Feeling strong."
    optional: true
- takeScreenshot: screenshots/journal-02-entry.png

# ================= Badges tab =================
- tapOn:
    text: "Badges"
    optional: true
- assertVisible:
    text: "Achievements"
    optional: true
- takeScreenshot: screenshots/badges-01.png
- assertVisible:
    text: "Unlocked"
    optional: true

# ================= Profile tab =================
- tapOn:
    text: "Profile"
    optional: true
- assertVisible:
    text: "Language"
    optional: true
- takeScreenshot: screenshots/profile-01.png
- assertVisible:
    text: "Appearance"
    optional: true
- assertVisible:
    text: "Get DrySpell Plus"
    optional: true

# ================= Paywall =================
- tapOn:
    text: "Get DrySpell Plus"
    optional: true
- assertVisible:
    text: "Go further with DrySpell Plus"
    optional: true
- takeScreenshot: screenshots/paywall-01.png
- assertVisible:
    text: "Start free trial"
    optional: true

# Restore is safe: no Play Store on emulator, always reports nothing found
- tapOn:
    text: "Restore purchase"
    optional: true
- extendedWaitUntil:
    visible: "Restore purchase — none found"
    timeout: 15000
    optional: true
- takeScreenshot: screenshots/paywall-02-restore.png

# Back to Profile
- tapOn:
    text: "Maybe later"
    optional: true
# ================= Dark mode =================
- extendedWaitUntil:
    visible: "Appearance"
    timeout: 15000
    optional: true
- tapOn:
    text: "Dark"
    optional: true
- takeScreenshot: screenshots/profile-02-dark.png
