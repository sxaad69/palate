appId: com.twopurse.app
---
# Full-coverage E2E: every screen, every major interactive state, screenshot
# after each significant state change. All smoke.yaml assertions are kept
# (they prove functionality); this file adds the visual proof on top.
#
# Screenshot map (11 total):
#   onboarding-01-fights.png      slide 1: "Money fights, solved gently"
#   onboarding-02-currency.png    slide 2: currency picker (USD selected)
#   onboarding-03-moneydate.png   slide 3: "A monthly money date"
#   envelopes-01.png              Envelopes home: starter envelopes + summary
#   expense-01-sheet.png          Add-expense bottom sheet
#   envelopes-02-expense.png      Envelopes home reflecting the $25 expense
#   envelope-01-edit.png          Edit-envelope sheet: recent spending + rollover
#   moneydate-01.png              Money date: review + rollover card
#   profile-01.png                Profile tab (light)
#   paywall-01.png                Paywall ("TwoPurse Pro")
#   profile-02-dark.png           Profile tab (dark mode)

# Fresh install state on every run
- launchApp:
    appId: "com.twopurse.app"
    clearState: true
- tapOn:
    text: "Wait"
    optional: true
- tapOn:
    text: "Close app"
    optional: true

# Cold boot on software-rendered emulator is slow and variable — allow 3 min
- extendedWaitUntil:
    visible: "Money fights, solved gently"
    timeout: 180000
    optional: true

# ================= Onboarding (3 slides) =================
- takeScreenshot: screenshots/onboarding-01-fights.png
- assertVisible:
    text: "Money fights, solved gently"
- assertVisible:
    text: "Money fights, solved gently"
- tapOn:
    text: "Continue"
- assertVisible:
    text: "Currency"
- tapOn:
    text: "USD"
- takeScreenshot: screenshots/onboarding-02-currency.png
- tapOn:
    text: "Continue"
- assertVisible:
    text: "A monthly money date"
- takeScreenshot: screenshots/onboarding-03-moneydate.png
- tapOn:
    text: "Get started"
# ================= Envelopes home =================
- assertVisible:
    text: "Envelopes"
- assertVisible:
    text: "Groceries"
- assertVisible:
    # NOTE: envelope sub-lines render "$0 spent · $400 left to spend" —
    # bare "left to spend" is a substring (run 40002978820 screenshot).
    text: ".*left to spend.*"
- takeScreenshot: screenshots/envelopes-01.png

# ================= Add expense =================
- tapOn:
    text: "Add expense"
- assertVisible:
    text: "Add expense"
- assertVisible:
    text: "Who spent it?"
- takeScreenshot: screenshots/expense-01-sheet.png

- tapOn:
    id: "amountInput"
- inputText: "25"
- hideKeyboard
- tapOn:
    id: "saveExpenseBtn"

# Home reflects the new expense
- assertVisible:
    text: "Envelopes"
- takeScreenshot: screenshots/envelopes-02-expense.png

# ================= Edit envelope =================
- tapOn:
    text: "Groceries"
- assertVisible:
    text: "Edit envelope"
- assertVisible:
    text: "This month\u2019s spending"
- assertVisible:
    text: "Roll leftover into savings"
- takeScreenshot: screenshots/envelope-01-edit.png

- tapOn:
    text: "Save"
- assertVisible:
    text: "Envelopes"
# ================= Money date tab =================
- tapOn:
    text: "Money date"
- assertVisible:
    # NOTE: renders as one node "Reviewing October 2026" (reviewFor +
    # month label in a single Text) — bare "Reviewing" cannot match.
    text: ".*Reviewing.*"
- assertVisible:
    text: "Roll over & close month"
- takeScreenshot: screenshots/moneydate-01.png

# ================= Profile tab =================
- tapOn:
    text: "Profile"
- assertVisible:
    text: "Appearance"
- takeScreenshot: screenshots/profile-01.png

# ================= Paywall =================
- tapOn:
    text: "Get TwoPurse Pro"
- assertVisible:
    text: "TwoPurse Pro"
- takeScreenshot: screenshots/paywall-01.png

- tapOn:
    text: "Continue with free"
- assertVisible:
    text: "Profile"
# ================= Dark mode =================
- tapOn:
    text: "Dark"
- takeScreenshot: screenshots/profile-02-dark.png
