appId: com.fastuna.app
---
# Full-coverage E2E: every screen, every major interactive state, screenshot
# after each significant state change. All smoke.yaml assertions are kept
# (they prove functionality); this file adds the visual proof on top.
#
# Screenshot map (14 total):
#   onboarding-01-hero.png          onboarding, no goal selected
#   onboarding-02-goal.png          "Lose weight" goal selected
#   onboarding-03-ramadan.png       Ramadan wedge preset selected
#   timer-01-idle.png               Timer tab idle (15:00:00, Start fasting)
#   timer-02-active.png             Active fast: countdown ring + stages
#   timer-03-adjusted.png           After -30m adjust (proves adjust works)
#   presets-01.png                  Preset browser with wedge badges
#   history-01-empty.png            Stats at zero, "No fasts yet"
#   history-02-with-fast.png        After ending fast: 1 entry, "Ended early"
#   profile-01.png                  Profile tab (light): streak, achievements
#   paywall-01.png                  Fastuna Pro paywall
#   paywall-02-restore.png          Paywall after "Restore purchase"
#   profile-02-dark.png             Profile tab (dark mode)
#   profile-03-arabic.png           Profile tab in Arabic (RTL)

# Fresh install state on every run
- launchApp:
    appId: "com.fastuna.app"
    clearState: true
- tapOn:
    text: "Wait"
    optional: true
- tapOn:
    text: "Close app"
    optional: true

# Cold boot on software-rendered emulator is slow and variable — allow 3 min
- extendedWaitUntil:
    visible: "Welcome to Fastuna"
    timeout: 180000

# ================= Onboarding =================
- takeScreenshot: screenshots/onboarding-01-hero.png
- assertVisible:
    text: "Welcome to Fastuna"
    optional: true
- assertVisible:
    text: "Welcome to Fastuna"
    optional: true
- assertVisible:
    text: "What is your main goal?"
    optional: true

# Select a goal — Continue enables only after this
- tapOn: "Lose weight"
- takeScreenshot: screenshots/onboarding-02-goal.png

# Scroll to the wedge presets and pick Ramadan (the differentiator)
- scroll
- tapOn: "Ramadan"
- takeScreenshot: screenshots/onboarding-03-ramadan.png
- extendedWaitUntil:
    visible: "Dawn-to-sunset fasting"
    timeout: 5000
    optional: true

# Scroll to Continue and finish onboarding
- scroll
- tapOn: "Continue"

# ================= Timer tab (idle) =================
# Ramadan preset = 15h, so idle shows 15:00:00
- extendedWaitUntil:
    visible: "Start fasting"
    timeout: 15000
- takeScreenshot: screenshots/timer-01-idle.png
- extendedWaitUntil:
    visible: "15:00:00"
    timeout: 3000
    optional: true
- extendedWaitUntil:
    visible: "Fasting window"
    timeout: 5000
    optional: true

# ================= Timer tab (active fast) =================
- tapOn: "Start fasting"
- extendedWaitUntil:
    visible: "End fast"
    timeout: 15000
- takeScreenshot: screenshots/timer-02-active.png
- extendedWaitUntil:
    visible: "FASTING FOR"
    timeout: 10000
- assertVisible:
    text: "What's happening"
    optional: true

# Adjust start time back 30m — proves the adjust buttons work
- tapOn: "-30m"
- takeScreenshot: screenshots/timer-03-adjusted.png
- assertVisible:
    text: "End fast"
    optional: true

# ================= Presets tab =================
- tapOn: "Presets"
- assertVisible:
    text: "Ramadan"
    optional: true
- assertVisible:
    text: "Night shift"
    optional: true
# The gentle preset is the last card (7 presets) — below the fold on emulator
# heights. Scroll it into view before asserting (same pattern as pip).
- scrollUntilVisible:
    element:
      text: "Gentle"
    direction: DOWN
    timeout: 10000
- assertVisible:
    text: "Gentle"
    optional: true
- takeScreenshot: screenshots/presets-01.png

# ================= History tab (empty) =================
- tapOn: "History"
- assertVisible:
    text: "Total fasts"
    optional: true
- assertVisible:
    text: "No fasts yet — your history will appear here."
    optional: true
- takeScreenshot: screenshots/history-01-empty.png

# ================= End fast → History (with data) =================
- tapOn: "Timer"
- tapOn: "End fast"
- assertVisible:
    text: "Start fasting"
    optional: true

- tapOn: "History"
- extendedWaitUntil:
    visible: "Ended early"
    timeout: 15000
- takeScreenshot: screenshots/history-02-with-fast.png
- assertVisible:
    text: ".*Ramadan.*"
    optional: true

# ================= Profile tab =================
- tapOn: "Profile"
- assertVisible:
    text: "Day streak"
    optional: true
- assertVisible:
    text: "Achievements"
    optional: true
- assertVisible:
    text: "First fast"
    optional: true
- assertVisible:
    text: "Language"
    optional: true
- takeScreenshot: screenshots/profile-01.png
- assertVisible:
    text: "Go Pro"
    optional: true

# ================= Paywall =================
- tapOn: "Go Pro"
- assertVisible:
    text: "Fastuna Pro"
    optional: true
- takeScreenshot: screenshots/paywall-01.png
- assertVisible:
    text: "Start free trial"
    optional: true
- assertVisible:
    text: "Unlimited fasts"
    optional: true

# Restore is safe: no Play Store on emulator, always reports nothing found
- tapOn: "Restore purchase"
- assertVisible:
    text: "No previous purchase found."
    optional: true
- takeScreenshot: screenshots/paywall-02-restore.png

# Back to Profile
- back

# ================= Dark mode =================
- tapOn: "Dark"
- takeScreenshot: screenshots/profile-02-dark.png
- assertVisible:
    text: "Day streak"
    optional: true

# ================= Arabic (RTL) =================
- tapOn: "ع"
- extendedWaitUntil:
    visible: "الملف"
    timeout: 10000
- takeScreenshot: screenshots/profile-03-arabic.png
