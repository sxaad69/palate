appId: com.fernly.app
---
# Full-coverage E2E: every screen, every major interactive state, screenshot
# after each significant state change. All smoke.yaml assertions are kept
# (they prove functionality); this file adds the visual proof on top.
#
# Screenshot map (14 total):
#   onboarding-01.png            "Welcome to Fernly" + plant picker
#   today-01-tasks.png           Today tab: Monstera care tasks due
#   today-02-task-done.png       Today tab after completing a task
#   plants-01.png                Plants tab: Monstera in the collection
#   plant-01-detail.png          Plant detail: care schedule (water/fertilize/mist)
#   add-01.png                   Add plant: species picker + nickname
#   plants-02-two.png            Plants tab with Monstera + Pothos
#   doctor-01.png                Plant Doctor: symptom picker
#   doctor-02-diagnosis.png      Plant Doctor: "Likely causes" + treatment
#   profile-01.png               Profile tab (light)
#   paywall-01.png               Paywall ("Fernly Pro")
#   profile-02-dark.png          Profile tab (dark mode)

# Fresh install state on every run
- launchApp:
    appId: "com.fernly.app"
    clearState: true
- tapOn:
    text: "Wait"
    optional: true
- tapOn:
    text: "Close app"
    optional: true

# Cold boot on software-rendered emulator is slow and variable — allow 3 min
- extendedWaitUntil:
    visible: "Welcome to Fernly"
    timeout: 180000
    optional: true

# ================= Onboarding =================
- takeScreenshot: screenshots/onboarding-01.png
- assertVisible:
    text: "Welcome to Fernly"
- assertVisible:
    text: "Add your plants"
- tapOn:
    text: "Monstera"
- tapOn:
    text: "Continue"
# ================= Today tab (fresh plant: nothing due yet) =================
# NOTE (diagnosed from run 40003008475's failure screenshot): a newly
# adopted plant has NO due tasks — nextDueAt = adoptedAt + interval —
# so Today correctly shows the "All caught up" empty state, and the
# "day care streak" stat lives on the Profile tab, not here. The old
# asserts ("day care streak" + a "Done" tap on Today) described a UI
# that does not exist. The care-log proof now happens on the plant
# detail screen (per-type "Done" buttons), and the streak assert moved
# to the Profile section where the stat actually renders.
- assertVisible:
    text: "Today"
- assertVisible:
    text: "All caught up — your jungle is happy."
- takeScreenshot: screenshots/today-01-tasks.png

# ================= Plants tab =================
# NOTE: the tab label is "My plants" (bare "Plants" matches nothing),
# and list-card titles render "🌱 Monstera" (emoji prefix) — .* forms.
- tapOn:
    text: "My plants"
- assertVisible:
    text: "My plants"
- assertVisible:
    text: ".*Monstera.*"
- takeScreenshot: screenshots/plants-01.png

# ================= Plant detail =================
- tapOn:
    text: ".*Monstera.*"
# Care rows render as one node: "💧 Water · every 7 days" — .* forms.
- assertVisible:
    text: ".*Water.*"
- assertVisible:
    text: ".*Fertilize.*"
- takeScreenshot: screenshots/plant-01-detail.png

# Log a watering via the row's "Done" button — proves the care log
# works (the streak stat it feeds is asserted on Profile below)
- tapOn:
    text: "Done"
- takeScreenshot: screenshots/plant-02-care-logged.png

# Stack back returns to the collection
- back
- assertVisible:
    text: "My plants"
# ================= Add a second plant =================
- tapOn:
    text: "Add plant"
- assertVisible:
    text: "Choose species"
- takeScreenshot: screenshots/add-01.png

- tapOn:
    text: "Pothos"
- tapOn:
    text: "Nickname"
- inputText: "Pothy"
- hideKeyboard
- tapOn:
    text: "Save plant"
# Card title renders "🌱 Pothy" (emoji + nickname) — .* form.
- assertVisible:
    text: ".*Pothy.*"
- takeScreenshot: screenshots/plants-02-two.png

# ================= Plant Doctor =================
- tapOn:
    text: "Doctor"
- assertVisible:
    text: "Plant Doctor"
# Subtitle node is the full sentence "What is wrong with your plant?
# Pick the symptoms you see." — .* form (no trailing ? — regex escape).
- assertVisible:
    text: ".*What is wrong with your plant.*"
- takeScreenshot: screenshots/doctor-01.png

- tapOn:
    text: "Yellow leaves"
- tapOn:
    text: "Diagnose"
- assertVisible:
    text: "Likely causes"
- takeScreenshot: screenshots/doctor-02-diagnosis.png

# ================= Profile tab =================
- tapOn:
    text: "Profile"
- assertVisible:
    text: "Profile"
- assertVisible:
    text: "Appearance"
# The care-streak stat lives here (label renders as its own node)
- assertVisible:
    text: "day care streak"
- takeScreenshot: screenshots/profile-01.png

# ================= Paywall =================
- tapOn:
    text: "Go Pro"
- assertVisible:
    text: "Fernly Pro"
- takeScreenshot: screenshots/paywall-01.png

# Stack back returns to Profile
- back
- assertVisible:
    text: "Profile"
# ================= Dark mode =================
- tapOn:
    text: "Dark"
- takeScreenshot: screenshots/profile-02-dark.png
