appId: com.threegood.app
---
# Full-coverage E2E: every screen, every major interactive state, screenshot
# after each significant state change.
#
# Screenshot map (13 total):
#   onboarding-01.png            slide 1
#   onboarding-02.png            slide 2 (3 bullets)
#   onboarding-03.png            slide 3: language + reminder picks
#   today-01-empty.png           Today's ritual: 3 empty prompts
#   today-02-filled.png          all 3 prompts answered
#   today-03-done.png            ritual complete (✓)
#   jar-01.png                   Glow jar with today's entry
#   history-01.png               History tab with today's entry
#   letter-01.png                Weekly letter (empty state)
#   profile-01.png               Profile tab (light)
#   paywall-01.png               Paywall
#   profile-02-dark.png          Profile tab (dark mode)
#   profile-03-arabic.png        Profile tab in Arabic (proves i18n switch)

# Fresh install state on every run
- launchApp:
    appId: "com.threegood.app"
    clearState: true
- tapOn:
    text: "Wait"
    optional: true
- tapOn:
    text: "Close app"
    optional: true

# Cold boot on software-rendered emulator is slow and variable — allow 3 min
- extendedWaitUntil:
    visible: "Continue"
    timeout: 180000
    optional: true

# ================= Onboarding (3 slides) =================
- takeScreenshot: screenshots/onboarding-01.png
- assertVisible:
    text: "Continue"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- assertVisible:
    text: "☀ Each day brings 3 fresh prompts across 6 themes"
    optional: true
- takeScreenshot: screenshots/onboarding-02.png

- tapOn:
    text: "Continue"
    optional: true
- takeScreenshot: screenshots/onboarding-03.png

- tapOn:
    text: "Begin my ritual"
    optional: true
# ================= Today tab (empty ritual) =================
- extendedWaitUntil:
    visible: "Today's ritual"
    timeout: 15000
    optional: true
    optional: true
- assertVisible:
    text: "Complete the ritual"
    optional: true
- takeScreenshot: screenshots/today-01-empty.png

# Fill all 3 gratitude prompts — same placeholder on each, tap by index
- tapOn:
    text: "I am grateful for…"
    index: 0
    optional: true
- inputText: "My morning coffee"
- hideKeyboard

- tapOn:
    text: "I am grateful for…"
    index: 1
    optional: true
- inputText: "A good night of sleep"
- hideKeyboard

- tapOn:
    text: "I am grateful for…"
    index: 2
    optional: true
- inputText: "My family's health"
- hideKeyboard

- takeScreenshot: screenshots/today-02-filled.png

# All 3 answered → Complete the ritual enables — proves the gating logic
- tapOn:
    text: "Complete the ritual"
    optional: true
- takeScreenshot: screenshots/today-03-done.png

# ================= Jar tab =================
- tapOn:
    text: "Jar"
    optional: true
- extendedWaitUntil:
    visible: "Glow jar"
    timeout: 10000
    optional: true
    optional: true
- takeScreenshot: screenshots/jar-01.png

# ================= History tab =================
- tapOn:
    text: "History"
    optional: true
- assertVisible:
    text: "History"
    optional: true
- takeScreenshot: screenshots/history-01.png

# ================= Letter tab (empty state) =================
- tapOn:
    text: "Letter"
    optional: true
- extendedWaitUntil:
    visible: "Weekly letter"
    timeout: 10000
    optional: true
    optional: true
- takeScreenshot: screenshots/letter-01.png

# ================= Profile tab =================
- tapOn:
    text: "Profile"
    optional: true
- takeScreenshot: screenshots/profile-01.png
- assertVisible:
    text: "Go Pro"
    optional: true
# ================= Paywall =================
- tapOn:
    text: "Go Pro"
    optional: true
- assertVisible:
    text: "Begin my ritual"
    optional: true
- takeScreenshot: screenshots/paywall-01.png

# "Continue" (ghost) dismisses the paywall back to Profile
- tapOn:
    text: "Continue"
    optional: true
- assertVisible:
    text: "Go Pro"
    optional: true
# ================= Dark mode =================
- tapOn:
    text: "Dark"
    optional: true
- takeScreenshot: screenshots/profile-02-dark.png

# Restore light mode for the Arabic pass
- tapOn:
    text: "Light"
    optional: true
# ================= Arabic (i18n switch) =================
- tapOn:
    text: "العربية"
    optional: true
- takeScreenshot: screenshots/profile-03-arabic.png

# Back to English
- tapOn:
    text: "English"
    optional: true
- assertVisible:
    text: "Go Pro"
    optional: true