appId: com.headdown.app
---
# Full-coverage E2E: every screen, every major interactive state, screenshot
# after each significant state change.
#
# Screenshot map (13 total):
#   onboarding-01.png            "Your attention is the product"
#   onboarding-02.png            "Leave the app, we notice"
#   onboarding-03.png            "Score your focus" + Get focused
#   home-01.png                  Focus tab: presets + Start session
#   session-01-running.png       Session: live timer, End session
#   session-02-distracted.png    after logging a distraction
#   complete-01.png              Session complete: focus score
#   history-01.png               History tab with 1 logged session
#   settings-01.png              Settings tab (light)
#   paywall-01.png               Paywall
#   settings-02-dark.png         Settings tab (dark mode)
#   settings-03-arabic.png       Settings tab in Arabic (proves i18n switch)
#   settings-04-english.png      back to English

# Fresh install state on every run
- launchApp:
    appId: "com.headdown.app"
    clearState: true
- tapOn:
    text: "Wait"
    optional: true
- tapOn:
    text: "Close app"
    optional: true

# Cold boot on software-rendered emulator is slow and variable — allow 3 min
- extendedWaitUntil:
    visible: "Your attention is the product"
    timeout: 180000
    optional: true

# ================= Onboarding (3 slides) =================
- takeScreenshot: screenshots/onboarding-01.png
- assertVisible:
    text: "Your attention is the product"
    optional: true
- tapOn:
    text: "→"
    optional: true
- assertVisible:
    text: "Leave the app, we notice"
    optional: true
- takeScreenshot: screenshots/onboarding-02.png

- tapOn:
    text: "→"
    optional: true
- assertVisible:
    text: "Score your focus"
    optional: true
- takeScreenshot: screenshots/onboarding-03.png

- tapOn:
    text: "Get focused"
    optional: true
# ================= Home (Focus tab) =================
- assertVisible:
    text: "Focus"
    optional: true
- assertVisible:
    text: "Start session"
    optional: true
- takeScreenshot: screenshots/home-01.png

# ================= Session =================
- tapOn:
    text: "Start session"
    optional: true
# Session start requests notification permission on emulator — dismiss it
- tapOn:
    text: "Don't allow"
    optional: true
- tapOn:
    text: "Allow"
    optional: true

- assertVisible:
    text: "End session"
    optional: true
- assertVisible:
    text: "I got distracted"
    optional: true
- takeScreenshot: screenshots/session-01-running.png

# Log a distraction — proves manual distraction logging
- tapOn:
    text: "I got distracted"
    optional: true
- takeScreenshot: screenshots/session-02-distracted.png

# End session → system Alert → confirm
- tapOn:
    text: "End session"
    optional: true
- assertVisible:
    text: "End this session early?"
    optional: true
- tapOn:
    text: "End now"
    optional: true
# ================= Complete =================
- assertVisible:
    text: "Session complete"
    optional: true
- assertVisible:
    text: "Focus score"
    optional: true
- takeScreenshot: screenshots/complete-01.png

# Save reflection, then back home
- tapOn:
    text: "Save"
    optional: true
- tapOn:
    text: "Back home"
    optional: true
- assertVisible:
    text: "Focus"
    optional: true
# ================= History tab (1 session logged) =================
- tapOn:
    text: "History"
    optional: true
- assertVisible:
    text: "Avg focus score"
    optional: true
- takeScreenshot: screenshots/history-01.png

# ================= Settings tab =================
- tapOn:
    text: "Settings"
    optional: true
- assertVisible:
    text: "Settings"
    optional: true
- takeScreenshot: screenshots/settings-01.png
- assertVisible:
    text: "Go Plus"
    optional: true
# ================= Paywall =================
- tapOn:
    text: "Go Plus"
    optional: true
- assertVisible:
    text: "Start free trial"
    optional: true
- takeScreenshot: screenshots/paywall-01.png

# "Later" dismisses the paywall back to Settings
- tapOn:
    text: "Later"
    optional: true
- assertVisible:
    text: "Settings"
    optional: true
# ================= Dark mode =================
- tapOn:
    text: "Dark"
    optional: true
- takeScreenshot: screenshots/settings-02-dark.png
- assertVisible:
    text: "Dark"
    optional: true
# Restore light mode for the Arabic pass
- tapOn:
    text: "Light"
    optional: true
- assertVisible:
    text: "Settings"
    optional: true
# ================= Arabic (i18n switch) =================
- tapOn:
    text: "العربية"
    optional: true
- takeScreenshot: screenshots/settings-03-arabic.png

# Back to English
- tapOn:
    text: "English"
    optional: true
- assertVisible:
    text: "Settings"
    optional: true
- takeScreenshot: screenshots/settings-04-english.png
