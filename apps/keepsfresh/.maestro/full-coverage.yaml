appId: com.keepsfresh.pantry
---
# Full-coverage E2E: every screen, every major interactive state, screenshot
# after each significant state change. All smoke.yaml assertions are kept
# (they prove functionality); this file adds the visual proof on top.
#
# Screenshot map (13 total):
#   onboarding-01-waste.png       slide 1: "Nothing goes to waste"
#   onboarding-02-soon.png        slide 2: "Use soon, not too late"
#   onboarding-03-savings.png     slide 3: "Watch your savings grow"
#   pantry-01-empty.png           Pantry tab, empty state
#   add-01-form.png               Add item form (name/category/location/expiry)
#   add-02-suggestions.png        Smart food-DB suggestions after typing "Milk"
#   pantry-02-with-item.png       Pantry with Milk under "This week"
#   pantry-03-used-up.png         Pantry empty again after "Used up"
#   alerts-01-empty.png           Alerts tab, nothing expiring soon
#   stats-01.png                  Stats tab: 1 item saved
#   profile-01.png                Profile tab (light)
#   paywall-01.png                Paywall (weekly plan + trial)
#   paywall-02-restore.png        Paywall after "Restore purchase" (no-op on emulator)
#   profile-02-dark.png           Profile tab (dark mode)

# Fresh install state on every run
- launchApp:
    appId: "com.keepsfresh.pantry"
    clearState: true
- tapOn:
    text: "Wait"
    optional: true
- tapOn:
    text: "Close app"
    optional: true

# Cold boot on software-rendered emulator is slow and variable — allow 3 min
- extendedWaitUntil:
    visible: "KeepsFresh"
    timeout: 180000
    optional: true

# ================= Onboarding (3 slides) =================
- takeScreenshot: screenshots/onboarding-01-waste.png
- assertVisible:
    text: "KeepsFresh"
- assertVisible:
    text: "Nothing goes to waste"
- tapOn:
    text: "Continue"
- assertVisible:
    text: "Use soon, not too late"
- takeScreenshot: screenshots/onboarding-02-soon.png

- tapOn:
    text: "Continue"
- assertVisible:
    text: "Watch your savings grow"
- takeScreenshot: screenshots/onboarding-03-savings.png

- tapOn:
    text: "Get started"
# ================= Pantry tab (empty) =================
- assertVisible:
    text: "Your pantry is empty"
- takeScreenshot: screenshots/pantry-01-empty.png

# ================= Add item (smart default from food DB) =================
# NOTE: two "Add item" buttons exist on the empty Pantry screen (header
# pill + empty-state CTA). Maestro's text tap hit the header pill (its
# bounds overlap the status bar) and the AddItem modal never opened —
# diagnosed from run 39011918361's failure screenshot ("Milk" landed in
# the Pantry SEARCH field, no form). Tap the empty-state CTA by testID.
- tapOn:
    id: "add-item-empty"
- extendedWaitUntil:
    visible: "Item name"
    timeout: 15000
    optional: true
- takeScreenshot: screenshots/add-01-form.png
# Tap the name field FIRST: inputText types into the focused
# element, and nothing focuses this field on form open — run
# 40078899557 shows the typed text never landed (fresh form,
# empty name, no suggestions). Do NOT hideKeyboard after typing:
# the form is a fullScreen RN Modal and a BACK press pops it
# (run 40075233430: modal closed, pantry empty again).
- tapOn:
    text: "Item name"
- inputText: "Milk"
# Food-DB suggestion / typed name — proves the smart-default lookup
- assertVisible:
    text: "Milk"
- takeScreenshot: screenshots/add-02-suggestions.png

# Dismiss the keyboard by tapping a harmless label: with the
# keyboard open, scrollUntilVisible cannot swipe the form (run
# 40081041951: the swipe area is covered by Gboard). Do NOT use
# hideKeyboard — a BACK press pops the fullScreen modal (run
# 40075233430). Tapping a ScrollView label dismisses the
# keyboard with no side effect.
- tapOn:
    text: "Category"
# The submit button is "Save" ("Add to pantry" exists nowhere in
# the app) and sits at the bottom of the scrollable form.
- scrollUntilVisible:
    element:
      text: "Save"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "Save"
# ================= Pantry tab (with item) =================
- assertVisible:
    text: "Milk"
- assertVisible:
    text: "This week"
- takeScreenshot: screenshots/pantry-02-with-item.png

# Mark the item used up — it leaves the pantry and feeds the stats counter
- tapOn:
    text: "Used up"
- assertVisible:
    text: "Your pantry is empty"
- takeScreenshot: screenshots/pantry-03-used-up.png

# ================= Alerts tab =================
- tapOn:
    text: "Alerts"
- assertVisible:
    text: "Use soon"
- assertVisible:
    text: "Nothing expiring soon. Nicely stocked."
- takeScreenshot: screenshots/alerts-01-empty.png

# ================= Stats tab =================
- tapOn:
    text: "Stats"
- assertVisible:
    text: "Waste saved"
- assertVisible:
    text: "Money saved"
- assertVisible:
    text: "items saved"
- takeScreenshot: screenshots/stats-01.png

# ================= Profile tab =================
- tapOn:
    text: "Profile"
- assertVisible:
    text: "Appearance"
- assertVisible:
    text: "Language"
- takeScreenshot: screenshots/profile-01.png

# ================= Paywall =================
- tapOn:
    text: "Go Pro — unlimited items"
- assertVisible:
    text: "Never throw food away again"
- assertVisible:
    text: "Weekly plan · free trial · cancel anytime"
- takeScreenshot: screenshots/paywall-01.png

# Restore is a safe no-op on the emulator (no Play Store) — paywall stays put
- tapOn:
    text: "Restore purchase"
- assertVisible:
    text: "Never throw food away again"
- takeScreenshot: screenshots/paywall-02-restore.png

- tapOn:
    text: "Cancel"
- assertVisible:
    text: "Profile"
# ================= Dark mode =================
- tapOn:
    text: "Dark"
- takeScreenshot: screenshots/profile-02-dark.png
