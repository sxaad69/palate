appId: com.lanceledger.app
---
# Full-coverage E2E for LanceLedger: every screen, every major interactive
# state, screenshot after each significant state change.
#
# Screenshot map (14 total):
#   onboarding-01.png            "Know your number", currency + 25% tax
#   onboarding-02-tax.png        tax stepper tapped to 30%
#   today-01-empty.png           Dashboard, no transactions
#   add-01-expense.png           Add expense form
#   add-02-filled.png            expense form filled (250, Coffee beans)
#   add-03-saved.png             "Saved ✓" confirmation
#   today-02-expense.png         Dashboard with the expense logged
#   add-04-income.png            Add income form (kind chip switched)
#   add-05-income-saved.png      income saved confirmation
#   today-03-both.png            Dashboard with expense + income
#   clients-01-empty.png         Clients tab, empty state
#   clients-02-added.png         client "Acme Corp" added
#   reports-01.png               Reports tab
#   settings-01.png              Settings tab (light)
#   paywall-01.png               Paywall
#   settings-02-dark.png         Settings tab (dark mode)

# Fresh install state on every run
- launchApp:
    appId: "com.lanceledger.app"
    clearState: true
- tapOn:
    text: "Wait"
    optional: true
- tapOn:
    text: "Close app"
    optional: true

# Cold boot on software-rendered emulator is slow and variable — allow 3 min
- extendedWaitUntil:
    visible: "Know your number"
    timeout: 180000
    optional: true

# ================= Onboarding =================
- takeScreenshot: screenshots/onboarding-01.png
- assertVisible:
    text: "Know your number"
- assertVisible:
    text: "What currency do you work in?"
# Tax stepper: 25% -> 30%
- tapOn:
    text: "+"
- assertVisible:
    text: "30%"
- takeScreenshot: screenshots/onboarding-02-tax.png

- tapOn:
    text: "Start tracking"
# ================= Dashboard (empty) =================
- extendedWaitUntil:
    visible: "Add expense"
    timeout: 30000
    optional: true
- takeScreenshot: screenshots/today-01-empty.png
- assertVisible:
    text: "income"
- assertVisible:
    text: "expenses"
# ================= Add expense =================
- tapOn:
    text: "Add"
- assertVisible:
    text: "Amount"
- takeScreenshot: screenshots/add-01-expense.png

- tapOn:
    text: "0.00"
- inputText: "250"
- hideKeyboard
- tapOn:
    text: "Vendor / note"
- inputText: "Coffee beans"
- hideKeyboard
- assertVisible:
    text: "Coffee beans"
- takeScreenshot: screenshots/add-02-filled.png

- tapOn:
    text: "Save"
- extendedWaitUntil:
    visible: "Saved"
    timeout: 15000
    optional: true
- takeScreenshot: screenshots/add-03-saved.png

# Saved -> navigates back to Dashboard
- tapOn:
    text: "Today"
- assertVisible:
    text: "Coffee beans"
- takeScreenshot: screenshots/today-02-expense.png

# ================= Add income =================
- tapOn:
    text: "Add"
- tapOn:
    text: "Add income"
- assertVisible:
    text: "Client name"
- takeScreenshot: screenshots/add-04-income.png

- tapOn:
    text: "0.00"
- inputText: "1200"
- hideKeyboard
- tapOn:
    text: "Save"
- extendedWaitUntil:
    visible: "Saved"
    timeout: 15000
    optional: true
- takeScreenshot: screenshots/add-05-income-saved.png

- tapOn:
    text: "Today"
- assertVisible:
    text: "Coffee beans"
- takeScreenshot: screenshots/today-03-both.png

# ================= Clients =================
- tapOn:
    text: "Clients"
- assertVisible:
    text: "No clients yet"
- takeScreenshot: screenshots/clients-01-empty.png

- tapOn:
    text: "+ Add client"
- tapOn:
    text: "Client name"
- inputText: "Acme Corp"
- hideKeyboard
- tapOn:
    text: "Save"
- assertVisible:
    text: "Acme Corp"
- takeScreenshot: screenshots/clients-02-added.png

# ================= Reports =================
- tapOn:
    text: "Reports"
- assertVisible:
    text: "Reports"
- takeScreenshot: screenshots/reports-01.png
- assertVisible:
    text: "Deductible expenses"
# ================= Settings =================
- tapOn:
    text: "Settings"
- assertVisible:
    text: "Appearance"
- takeScreenshot: screenshots/settings-01.png
- assertVisible:
    text: "Get LanceLedger Plus"
# ================= Paywall =================
- tapOn:
    text: "Get LanceLedger Plus"
- assertVisible:
    text: "Go further with LanceLedger Plus"
- takeScreenshot: screenshots/paywall-01.png
- assertVisible:
    text: "Weekly"
# Back to Settings
- back

# ================= Dark mode =================
- tapOn:
    text: "Dark"
- takeScreenshot: screenshots/settings-02-dark.png
- assertVisible:
    text: "Dark"