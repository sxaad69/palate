appId: com.modestfit.app
---
# Full-coverage E2E Journey (27 Granular Steps & Function Screenshots)
# Covers:
# 1. Onboarding & Modesty Preferences
# 2. Studio: Model switches (Sand, Black, Olive), Category switches, Nuance swatches, Save look
# 3. Runway: Street Style Duel voting, Percentage reveal, +10 Karma pill, Leaderboard tabs (District, GCC, Global)
# 4. Wardrobe: Empty state, Add piece, Saved piece
# 5. Outfits: Empty state, New outfit, Modesty verification badge
# 6. Negative Scenarios: Gated Insights & Gated Planner
# 7. Paywall: Hero Annual Plan ($29.99/yr) & Weekly Plan ($2.99/wk)

# Fresh install state on every run
- launchApp:
    appId: "com.modestfit.app"
    clearState: true
- tapOn:
    text: "Wait"
    optional: true
- tapOn:
    text: "Close app"
    optional: true

# Cold boot on software-rendered emulator
- extendedWaitUntil:
    visible: "Catalog your wardrobe"
    timeout: 180000
    optional: true

# ================= 1. Onboarding Flow (5 Steps) =================
- takeScreenshot: screenshots/step-01-onboarding-slide1.png
- assertVisible:
    text: "Catalog your wardrobe"
- tapOn:
    text: "Continue"

- takeScreenshot: screenshots/step-02-onboarding-slide2.png
- assertVisible:
    text: "Plan outfits by occasion"
- tapOn:
    text: "Continue"

- takeScreenshot: screenshots/step-03-onboarding-slide3.png
- assertVisible:
    text: "Hijab pairing, done for you"
- tapOn:
    text: "Get started"

- extendedWaitUntil:
    visible: "Choose your language"
    timeout: 10000
- takeScreenshot: screenshots/step-04-onboarding-language.png
- assertVisible:
    text: "Choose your language"
- tapOn:
    text: "Continue"

- takeScreenshot: screenshots/step-05-onboarding-modesty-prefs.png
- assertVisible:
    text: "Your modesty preferences"
- tapOn:
    text: "Done"

# ================= 2. Atelier Studio Flow (7 Steps) =================
- extendedWaitUntil:
    visible: "Atelier Studio"
    timeout: 15000
    optional: true
- assertVisible:
    text: "Atelier Studio"
- takeScreenshot: screenshots/step-06-studio-default-sand.png

# Switch model 1 -> model 2 (Monochrome Midnight Noir)
- tapOn:
    text: "›"
    optional: true
- takeScreenshot: screenshots/step-07-studio-model-switch-black.png

# Switch model 2 -> model 3 (Olive Silk & Rose)
- tapOn:
    text: "›"
    optional: true
- takeScreenshot: screenshots/step-08-studio-model-switch-olive.png

# Select Hijab category
- tapOn:
    text: "Hijab"
    optional: true
- takeScreenshot: screenshots/step-09-studio-category-hijab.png

# Select Dusty Rose nuance swatch
- tapOn:
    text: "Dusty Rose"
    optional: true
- takeScreenshot: screenshots/step-10-studio-swatch-dusty-rose.png

# Select Champagne Gold nuance swatch
- tapOn:
    text: "Champagne"
    optional: true
- takeScreenshot: screenshots/step-11-studio-swatch-champagne-gold.png

# Save Look to Studio
- tapOn:
    text: "Save Look to Studio"
    optional: true
- takeScreenshot: screenshots/step-12-studio-save-look-success.png

# ================= 3. Runway & Street Style Duels (5 Steps) =================
- tapOn:
    text: "Runway"
- extendedWaitUntil:
    visible: "Runway & Duels"
    timeout: 10000
    optional: true
- assertVisible:
    text: "Runway & Duels"
- takeScreenshot: screenshots/step-13-runway-duel-initial.png

# Vote in Duel (triggers percentage tally and +10 Karma)
- tapOn:
    text: "Tap to Vote"
    optional: true
- takeScreenshot: screenshots/step-14-runway-duel-voted-karma.png

# District Leaderboard
- scrollUntilVisible:
    element:
      text: ".*Fatima M..*"
    direction: DOWN
    timeout: 15000
    optional: true
- takeScreenshot: screenshots/step-15-runway-leaderboard-district.png

# GCC / Region Tab
- tapOn:
    text: ".*GCC / Region.*"
    optional: true
- takeScreenshot: screenshots/step-16-runway-leaderboard-gcc.png

# Global Tab
- tapOn:
    text: ".*Global.*"
    optional: true
- takeScreenshot: screenshots/step-17-runway-leaderboard-global.png

# ================= 4. Wardrobe Tab (3 Steps) =================
- tapOn:
    text: "Wardrobe"
- extendedWaitUntil:
    visible: "My Wardrobe"
    timeout: 15000
    optional: true
- takeScreenshot: screenshots/step-18-wardrobe-empty-starter.png
- assertVisible:
    text: "Your wardrobe is empty"

- tapOn:
    text: "Add piece"
- assertVisible:
    text: "Name"
- takeScreenshot: screenshots/step-19-wardrobe-add-piece-form.png
- tapOn:
    text: "e.g. Black linen abaya"
- inputText: "Black linen abaya"
- hideKeyboard
- scrollUntilVisible:
    element:
      text: "Save"
    direction: DOWN
    timeout: 20000
- tapOn:
    text: "Save"

- extendedWaitUntil:
    visible: "Black linen abaya"
    timeout: 15000
    optional: true
- takeScreenshot: screenshots/step-20-wardrobe-saved-valid-piece.png

# ================= 5. Outfits Tab & Modesty Verification (3 Steps) =================
- tapOn:
    text: "Outfits"
- assertVisible:
    text: "No outfits yet"
- takeScreenshot: screenshots/step-21-outfits-empty-state.png

- tapOn:
    text: "New outfit"
- assertVisible:
    text: ".*Select pieces.*"
- takeScreenshot: screenshots/step-22-createoutfit-selection.png
- tapOn:
    text: "e.g. Friday work look"
- inputText: "Friday work look"
- hideKeyboard
- tapOn:
    text: "Black linen abaya"
- scrollUntilVisible:
    element:
      text: "Save"
    direction: DOWN
    timeout: 20000
- tapOn:
    text: "Save"

- extendedWaitUntil:
    visible: "Friday work look"
    timeout: 15000
    optional: true
- takeScreenshot: screenshots/step-23-outfit-saved-modesty-passed.png

# ================= 6. Profile & Paywall (3 Steps) =================
- tapOn:
    text: "Profile"
- assertVisible:
    text: "Upgrade to Pro"
- takeScreenshot: screenshots/step-24-profile-tab.png

- tapOn:
    text: "Upgrade to Pro"
- assertVisible:
    text: "ModestFit Pro"
- takeScreenshot: screenshots/step-25-paywall-annual-hero.png

# Toggle Weekly Plan
- tapOn:
    text: ".*Weekly Pass.*"
    optional: true
- takeScreenshot: screenshots/step-26-paywall-weekly-option.png

- back

# ================= 7. Negative Scenario: Gated Insights (1 Step) =================
- scrollUntilVisible:
    element:
      text: ".*Wardrobe insights.*"
    direction: DOWN
    timeout: 30000
    optional: true
- tapOn:
    text: ".*Wardrobe insights.*"
- extendedWaitUntil:
    visible: "Insights are Pro"
    timeout: 10000
    optional: true
- takeScreenshot: screenshots/step-27-negative-insights-pro-gated.png
- assertVisible:
    text: "Insights are Pro"
