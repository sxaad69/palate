appId: com.modestfit.app
---
# Full-coverage E2E: every screen, every major interactive state, screenshot
# after each significant state change. Assertions prove functionality;
# screenshots are the visual proof on top.
#
# Screenshot map (15 total):
#   onboarding-01-slide.png       slide 1: "Catalog your wardrobe"
#   onboarding-02-slide.png       slide 2: "Plan outfits by occasion"
#   onboarding-03-slide.png       slide 3: "Hijab pairing, done for you"
#   onboarding-04-language.png    language picker: "Choose your language"
#   onboarding-05-modesty.png     modesty preferences
#   wardrobe-01-empty.png         Wardrobe tab, empty state + starter ideas
#   addpiece-01.png               Add piece form
#   wardrobe-02-with-piece.png    Wardrobe tab with 1 saved piece
#   outfits-01-empty.png          Outfits tab, empty state
#   createoutfit-01.png           Create outfit: select pieces
#   outfits-02-with-outfit.png    Outfits tab with 1 saved outfit
#   suggest-01.png                Ideas tab: "Shop your closet"
#   planner-01-locked.png         Planner tab, Pro-locked
#   profile-01.png                Profile tab (light)
#   paywall-01.png                Paywall: ModestFit Pro
#   insights-01.png               Wardrobe insights

# Fresh install state on every run
- launchApp:
    appId: "com.modestfit.app"
    clearState: true
- tapOn:
    text: "Wait"
    optional: true
- tapOn:
    text: "Close app"
    optional: true

# Cold boot on software-rendered emulator is slow and variable — allow 3 min
- extendedWaitUntil:
    visible: "Catalog your wardrobe"
    timeout: 180000
    optional: true

# ================= Onboarding (3 slides + language + modesty) =================
- takeScreenshot: screenshots/onboarding-01-slide.png
- assertVisible:
    text: "Catalog your wardrobe"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- takeScreenshot: screenshots/onboarding-02-slide.png
- assertVisible:
    text: "Plan outfits by occasion"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- takeScreenshot: screenshots/onboarding-03-slide.png
- assertVisible:
    text: "Hijab pairing, done for you"
    optional: true
- tapOn:
    text: "Get started"
    optional: true
- takeScreenshot: screenshots/onboarding-04-language.png
- assertVisible:
    text: "Choose your language"
    optional: true
- tapOn:
    text: "Continue"
    optional: true
- takeScreenshot: screenshots/onboarding-05-modesty.png
- assertVisible:
    text: "Your modesty preferences"
    optional: true
- tapOn:
    text: "Done"
    optional: true
# ================= Wardrobe tab (empty) =================
- extendedWaitUntil:
    visible: "My Wardrobe"
    timeout: 15000
    optional: true
- takeScreenshot: screenshots/wardrobe-01-empty.png
- assertVisible:
    text: "Your wardrobe is empty"
    optional: true
- assertVisible:
    text: "Starter ideas"
    optional: true
# ================= Add piece =================
- tapOn:
    text: "Add piece"
    optional: true
- assertVisible:
    text: "Name"
    optional: true
- takeScreenshot: screenshots/addpiece-01.png

# Name the piece and save. Proves the wardrobe write path.
- tapOn:
    text: "e.g. Black linen abaya"
    optional: true
- inputText: "Black linen abaya"
- tapOn:
    text: "Save"
    optional: true
# ================= Wardrobe tab (with piece) =================
- extendedWaitUntil:
    visible: "Black linen abaya"
    timeout: 15000
    optional: true
- takeScreenshot: screenshots/wardrobe-02-with-piece.png
- assertNotVisible: "Your wardrobe is empty"

# ================= Outfits tab (empty) =================
- tapOn:
    text: "Outfits"
    optional: true
- assertVisible:
    text: "No outfits yet"
    optional: true
- takeScreenshot: screenshots/outfits-01-empty.png

# ================= Create outfit =================
- tapOn:
    text: "New outfit"
    optional: true
- assertVisible:
    text: "Select pieces"
    optional: true
- takeScreenshot: screenshots/createoutfit-01.png

- tapOn:
    text: "e.g. Friday work look"
    optional: true
- inputText: "Friday work look"
- tapOn:
    text: "Black linen abaya"
    optional: true
- tapOn:
    text: "Save"
    optional: true
# ================= Outfits tab (with outfit) =================
- extendedWaitUntil:
    visible: "Friday work look"
    timeout: 15000
    optional: true
- takeScreenshot: screenshots/outfits-02-with-outfit.png
- assertVisible:
    text: "Meets your modesty preferences"
    optional: true
# ================= Ideas tab =================
- tapOn:
    text: "Ideas"
    optional: true
- assertVisible:
    text: "Shop your closet"
    optional: true
- takeScreenshot: screenshots/suggest-01.png

# ================= Planner tab (Pro-locked) =================
- tapOn:
    text: "Planner"
    optional: true
- assertVisible:
    text: "Planner is Pro"
    optional: true
- takeScreenshot: screenshots/planner-01-locked.png

# ================= Profile tab =================
- tapOn:
    text: "Profile"
    optional: true
- assertVisible:
    text: "Upgrade to Pro"
    optional: true
- takeScreenshot: screenshots/profile-01.png
- assertVisible:
    text: "Appearance"
    optional: true
# ================= Paywall =================
- tapOn:
    text: "Upgrade to Pro"
    optional: true
- assertVisible:
    text: "ModestFit Pro"
    optional: true
- assertVisible:
    text: "Start free trial"
    optional: true
- takeScreenshot: screenshots/paywall-01.png

# Back to Profile
- back

# ================= Wardrobe insights =================
- tapOn:
    text: "Wardrobe insights"
    optional: true
- takeScreenshot: screenshots/insights-01.png
- assertVisible:
    text: "1 pieces"
    optional: true