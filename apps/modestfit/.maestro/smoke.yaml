appId: com.modestfit.app
---
# Fresh install state on every run
- launchApp:
    clearState: true

# --- Onboarding: 3 slides, language, modesty prefs ---
- takeScreenshot: screenshots/shot-01-onboarding.png
- assertVisible: "Catalog your wardrobe"
- tapOn: "Continue"
- tapOn: "Continue"
- tapOn: "Get started"
- assertVisible: "Choose your language"
- tapOn: "Continue"
- assertVisible: "Your modesty preferences"
- tapOn: "Done"

# --- Atelier Studio Tab (Default Home) ---
- extendedWaitUntil:
    visible: "Atelier Studio"
    timeout: 15000
    optional: true
- assertVisible: "Atelier Studio"
- takeScreenshot: screenshots/shot-02-studio.png
- tapOn:
    text: "Save Look to Studio"
    optional: true

# --- Runway & Duels Tab ---
- tapOn: "Runway"
- assertVisible: "Runway & Duels"
- takeScreenshot: screenshots/shot-03-runway.png
- tapOn:
    text: "Tap to Vote"
    optional: true

# --- Wardrobe Tab ---
- tapOn: "Wardrobe"
- assertVisible: "My Wardrobe"

# --- Outfits Tab ---
- tapOn: "Outfits"
- assertVisible: "My Outfits"

# --- Profile & Paywall ---
- tapOn: "Profile"
- assertVisible: "Appearance"
- tapOn: "Upgrade to Pro"
- assertVisible: "ModestFit Pro"
- takeScreenshot: screenshots/shot-04-paywall.png
