name: E2E (emulator + Maestro) — Restory

# Builds a debug APK from the Expo managed project, boots an Android
# emulator on the GitHub runner, installs the APK and runs the Maestro
# smoke flow. Local builds only — no GitHub push yet, so this workflow
# is dormant until the repo is created.

on:
  push:
    branches: [main]
    paths:
      - 'apps/moodsleep/**'
      - '.github/workflows/e2e-moodsleep.yml'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/moodsleep/app/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: apps/moodsleep/app
        run: npm ci

      - name: Prebuild Android project
        working-directory: apps/moodsleep/app
        run: npx expo prebuild --platform android --clean
        env:
          CI: 'true'

      # Shared Gradle cache across the portfolio monorepo: key on Expo SDK,
      # not per-app lockfile, so apps 2-20 reuse Palate's downloads.
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/transforms-4
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-expo57
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build debug APK
        working-directory: apps/moodsleep/app/android
        run: ./gradlew assembleDebug --no-daemon

      # The Gradle build leaves the runner nearly full; reclaim space from
      # toolchains we never use BEFORE anything else downloads.
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          sudo docker image prune --all --force || true
          df -h / | tail -1

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run Maestro smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          script: |
            adb install -r apps/moodsleep/app/android/app/build/outputs/apk/debug/app-debug.apk
            maestro test apps/moodsleep/.maestro/smoke.yaml
