appId: com.restory.app
---
# Full-coverage E2E for Restory (moodsleep): every screen, every major
# interactive state, screenshot after each significant state change.
#
# Screenshot map (12 total):
#   onboarding-01-slide1.png     slide 1 "Your sleep writes your days"
#   onboarding-02-slide2.png     slide 2 "Twenty seconds, twice a day"
#   onboarding-03-slide3.png     slide 3 "The pattern is yours" + Begin
#   today-01-empty.png           Today tab, nothing logged
#   today-02-sleep-set.png       sleep quality 1 star tapped
#   today-03-mood-set.png        mood 🤩 tapped, "Saved" header
#   today-04-note.png            note typed into the journal field
#   insights-01-locked.png       Insights tab, Pro-locked state
#   paywall-01.png               Paywall
#   progress-01.png              Progress tab with today's entry in history
#   profile-01.png               Profile tab (light)
#   profile-02-dark.png          Profile tab (dark mode)

# Fresh install state on every run
- launchApp:
    appId: "com.restory.app"
    clearState: true
- tapOn:
    text: "Wait"
    optional: true
- tapOn:
    text: "Close app"
    optional: true

# Cold boot on software-rendered emulator is slow and variable — allow 3 min
- extendedWaitUntil:
    visible: "Your sleep writes your days"
    timeout: 180000
    optional: true

# ================= Onboarding =================
- takeScreenshot: screenshots/onboarding-01-slide1.png
- assertVisible:
    text: "Your sleep writes your days"
- tapOn:
    text: "Continue"
- takeScreenshot: screenshots/onboarding-02-slide2.png
- assertVisible:
    text: "Twenty seconds, twice a day"
- tapOn:
    text: "Continue"
- takeScreenshot: screenshots/onboarding-03-slide3.png
- assertVisible:
    text: "The pattern is yours"
- assertVisible:
    text: "Begin"
- tapOn:
    text: "Begin"
# ================= Today tab (empty) =================
- extendedWaitUntil:
    visible: "Last night"
    timeout: 30000
    optional: true
- takeScreenshot: screenshots/today-01-empty.png
- assertVisible:
    text: "How did you sleep?"
- assertVisible:
    text: "How are you feeling?"
# ================= Log sleep quality =================
- tapOn:
    text: "★"
# NOTE: display is "1 ★ · <label>" — match with .*
- assertVisible:
    text: "1 ★.*"
- takeScreenshot: screenshots/today-02-sleep-set.png

# ================= Log mood =================
- tapOn:
    text: "🤩"
- assertVisible:
    text: "Saved"
- takeScreenshot: screenshots/today-03-mood-set.png

# ================= Journal note =================
- tapOn:
    text: "One line about the day…"
- inputText: "Slept great, feeling sharp."
- hideKeyboard
- assertVisible:
    text: "Slept great, feeling sharp."
- takeScreenshot: screenshots/today-04-note.png

# ================= Insights tab (Pro-locked) =================
- tapOn:
    text: "Insights"
- assertVisible:
    text: "Your sleep has a story to tell"
- takeScreenshot: screenshots/insights-01-locked.png
- assertVisible:
    text: "Unlock your rest story"
# ================= Paywall =================
- tapOn:
    text: "Unlock your rest story"
- assertVisible:
    text: "Unlock your rest story"
- takeScreenshot: screenshots/paywall-01.png
- assertVisible:
    text: "Weekly plan"
# Back to Insights
- back

# ================= Progress tab =================
- tapOn:
    text: "Progress"
- assertVisible:
    text: "day streak"
- takeScreenshot: screenshots/progress-01.png
- assertVisible:
    text: "History"
- assertVisible:
    text: "5/5"
# ================= Profile tab =================
- tapOn:
    text: "Profile"
- assertVisible:
    text: "Appearance"
- takeScreenshot: screenshots/profile-01.png
- assertVisible:
    text: "Bedtime reminder"
- assertVisible:
    text: "Export data (CSV)"
# ================= Dark mode =================
- tapOn:
    text: "Dark"
- takeScreenshot: screenshots/profile-02-dark.png
- assertVisible:
    text: "Dark"