appId: com.naplet.app
---
# Full-coverage E2E: every screen, every major interactive state, screenshot
# after each significant state change. All smoke.yaml assertions are kept
# (they prove functionality); this file adds the visual proof on top.
#
# Screenshot map (12 total):
#   onboarding-01.png            "Welcome to Naplet" + baby name input
#   today-01-empty.png           Today tab, "Nothing logged yet today."
#   log-01.png                   Log tab: sleep / feed / diaper big buttons
#   log-02-sleeping.png          Sleep timer running ("Sleeping…")
#   feed-01.png                  Feed editor (type chips)
#   feed-02-bottle.png           Feed editor: Bottle + 120ml entered
#   diaper-01.png                Diaper editor: Dirty selected
#   today-02-events.png          Today timeline with sleep/feed/diaper events
#   stats-01.png                 Stats tab with a day of data
#   profile-01.png               Profile tab (light)
#   paywall-01.png               Paywall ("Naplet Pro", free trial)
#   profile-02-dark.png          Profile tab (dark mode)

# Fresh install state on every run
- launchApp:
    appId: "com.naplet.app"
    clearState: true
- tapOn:
    text: "Wait"
    optional: true
- tapOn:
    text: "Close app"
    optional: true

# Cold boot on software-rendered emulator is slow and variable — allow 3 min
- extendedWaitUntil:
    visible: "Welcome to Naplet"
    timeout: 180000
    optional: true

# ================= Onboarding =================
- takeScreenshot: screenshots/onboarding-01.png
- assertVisible:
    text: "Welcome to Naplet"
- assertVisible:
    text: "Baby's name"
# Personalize: the name flows into the Today header
- tapOn:
    text: "Baby's name"
- inputText: "Layla"
- hideKeyboard
- tapOn:
    text: "Continue"
# ================= Today tab (empty) =================
- assertVisible:
    text: "Today"
- assertVisible:
    text: "Nothing logged yet today."
- takeScreenshot: screenshots/today-01-empty.png

# ================= Log tab =================
- tapOn:
    text: "Log"
- assertVisible:
    text: ".*Start sleep"
- takeScreenshot: screenshots/log-01.png

# Start a sleep session — button flips to "End sleep", timer shows
- tapOn:
    text: ".*Start sleep"
- assertVisible:
    text: "Sleeping…"
# Button label is "🌙 End sleep" (emoji prefix in the same text node) —
# whole-text matching needs the .* prefix, same as ".*Start sleep" above.
- assertVisible:
    text: ".*End sleep"
- takeScreenshot: screenshots/log-02-sleeping.png

# End the sleep right away — proves the sleep timer round-trips
- tapOn:
    text: ".*End sleep"
- assertVisible:
    text: ".*Start sleep"
# ================= Feed editor =================
# The quick-log button's label is "🍼 Feed" (LogScreen) — bare "Feed"
# whole-matches nothing tappable here and the tap failed (run
# 40044831672). Use the button's exact label.
- tapOn:
    text: "🍼 Feed"
- assertVisible:
    text: "Feed"
- takeScreenshot: screenshots/feed-01.png

- tapOn:
    text: "Bottle"
# "Amount (ml)": parentheses are regex groups — the bare pattern can
# never whole-match the literal label. Escaped, it matches the label
# Text (index 0) and the TextInput's accessibilityLabel (index 1) —
# tap the input so inputText has a focused field.
- tapOn:
    text: "Amount \\(ml\\)"
    index: 1
- inputText: "120"
- hideKeyboard
- takeScreenshot: screenshots/feed-02-bottle.png
- tapOn:
    text: "Save"
# ================= Diaper editor =================
# Same emoji-prefix label as Feed: the button is "🩲 Diaper".
- tapOn:
    text: "🩲 Diaper"
- assertVisible:
    text: "Diaper"
- tapOn:
    text: "Dirty"
- takeScreenshot: screenshots/diaper-01.png
- tapOn:
    text: "Save"
# ================= Today tab (with events) =================
- tapOn:
    text: "Today"
- assertVisible:
    text: "Timeline"
- takeScreenshot: screenshots/today-02-events.png

# ================= Stats tab =================
- tapOn:
    text: "Stats"
- assertVisible:
    text: "Stats"
- assertVisible:
    text: "Feeds today"
- takeScreenshot: screenshots/stats-01.png

# ================= Profile tab =================
- tapOn:
    text: "Profile"
- assertVisible:
    text: "Appearance"
- takeScreenshot: screenshots/profile-01.png

# ================= Paywall =================
- tapOn:
    text: "Go Pro"
- assertVisible:
    text: "Naplet Pro"
- assertVisible:
    text: "Start free trial"
- takeScreenshot: screenshots/paywall-01.png

# Restore is safe: no Play Store on emulator, always reports nothing found
- tapOn:
    text: "Restore purchase"
- assertVisible:
    text: "No previous purchase found."
# Stack back returns to Profile
- back
- assertVisible:
    text: "Profile"
# ================= Dark mode =================
- tapOn:
    text: "Dark"
- takeScreenshot: screenshots/profile-02-dark.png
