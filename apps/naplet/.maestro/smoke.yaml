appId: com.naplet.app
---
- launchApp:
    clearState: true
- takeScreenshot: screenshots/shot-01.png
- assertVisible: "Welcome to Naplet"
- tapOn: "Continue"
- assertVisible: "Today"
- tapOn: "Log"
- tapOn: "Start sleep"
- takeScreenshot: screenshots/shot-02.png
- assertVisible: "End sleep"
- tapOn: "End sleep"
- tapOn: "Feed"
- assertVisible: "Feed"
- tapOn: "Save"
- tapOn: "Stats"
- takeScreenshot: screenshots/shot-03.png
- assertVisible: "Stats"
- tapOn: "Profile"
- assertVisible: "Profile"
- tapOn: "Go Pro"
- assertVisible: "Naplet Pro"

- takeScreenshot: screenshots/shot-04.png
