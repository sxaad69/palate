appId: com.pip.app
---
# Full-coverage E2E for Pip (tiny habits, Fogg recipes): every screen, every
# major interactive state, screenshot after each significant state change.
#
# Screenshot map (12 total):
#   onboarding-01.png        "Welcome to Pip", pick starter recipes
#   today-01-recipe.png       Today tab with starter recipe (floss one tooth)
#   today-02-shine.png        celebration screen after tapping Done
#   today-03-done.png         recipe marked "Done today"
#   recipes-01.png            Recipes tab list
#   editor-01.png            recipe editor, empty
#   editor-02-filled.png      editor filled (anchor, behavior, celebration)
#   recipes-02-new.png        Recipes tab with the new recipe
#   progress-01.png           Progress tab (streaks, wins)
#   profile-01.png            Profile tab (light)
#   paywall-01.png            Paywall
#   profile-02-dark.png       Profile tab (dark mode)

# Fresh install state on every run
- launchApp:
    appId: "com.pip.app"
    clearState: true
- tapOn:
    text: "Wait"
    optional: true
- tapOn:
    text: "Close app"
    optional: true

# Cold boot on software-rendered emulator is slow and variable — allow 3 min
- extendedWaitUntil:
    visible: "Welcome to Pip"
    timeout: 180000

# ================= Onboarding =================
- takeScreenshot: screenshots/onboarding-01.png
- assertVisible:
    text: "Welcome to Pip"
    optional: true
- assertVisible:
    text: "Pick 1–3 starter recipes"
    optional: true

# Template 0 ("floss one tooth") is pre-selected
# The Continue button sits at the bottom of the onboarding ScrollView —
# bring it into view before tapping (emulator screen heights vary)
- scrollUntilVisible:
    element:
      text: "Continue"
    direction: DOWN
    timeout: 10000
- tapOn: "Continue"

# ================= Today tab (with starter recipe) =================
- extendedWaitUntil:
    visible: ".*floss one tooth.*"
    timeout: 30000
- takeScreenshot: screenshots/today-01-recipe.png
- assertVisible:
    text: "Done"
    optional: true

# ================= Complete the habit -> celebration =================
- tapOn: "Done"
- assertVisible:
    text: "Shine!"
    optional: true
- takeScreenshot: screenshots/today-02-shine.png
- assertVisible:
    text: "I celebrated!"
    optional: true

- tapOn: "I celebrated!"
- assertVisible:
    text: "Done today"
    optional: true
- takeScreenshot: screenshots/today-03-done.png

# ================= Recipes tab =================
- tapOn: "Recipes"
- assertVisible:
    text: ".*floss one tooth.*"
    optional: true
- takeScreenshot: screenshots/recipes-01.png
- assertVisible:
    text: "New recipe"
    optional: true

# ================= Recipe editor =================
- tapOn: "New recipe"
- assertVisible:
    text: "After I… (e.g. brush my teeth)"
    optional: true
- takeScreenshot: screenshots/editor-01.png

- tapOn: "After I… (e.g. brush my teeth)"
- inputText: "pour my morning water"
- tapOn: "I will… (e.g. floss one tooth)"
- inputText: "drink one glass"
- hideKeyboard
- tapOn: "Fist pump"
- takeScreenshot: screenshots/editor-02-filled.png

- tapOn: "Save recipe"
- assertVisible:
    text: ".*drink one glass.*"
    optional: true
- takeScreenshot: screenshots/recipes-02-new.png

# ================= Progress tab =================
- tapOn: "Progress"
- assertVisible:
    text: ".*day streak.*"
    optional: true
- takeScreenshot: screenshots/progress-01.png
- assertVisible:
    text: "Best streak"
    optional: true

# ================= Profile tab =================
- tapOn: "Profile"
- assertVisible:
    text: "Appearance"
    optional: true
- takeScreenshot: screenshots/profile-01.png
- assertVisible:
    text: "Go Pro"
    optional: true

# ================= Paywall =================
- tapOn: "Go Pro"
- assertVisible:
    text: "Start free trial"
    optional: true
- takeScreenshot: screenshots/paywall-01.png
- assertVisible:
    text: "Restore purchase"
    optional: true

# Back to Profile
- back

# ================= Dark mode =================
- tapOn: "Dark"
- takeScreenshot: screenshots/profile-02-dark.png
- assertVisible:
    text: "Dark"
    optional: true
