appId: com.salahmate.app
---
# Full-coverage E2E for SalahMate: every screen, every major interactive
# state, screenshot after each significant state change.
#
# Screenshot map (13 total):
#   onboarding-01.png        "Your day, anchored in prayer"
#   today-01.png             Today tab: next prayer + prayer list
#   today-02-done.png        Fajr marked done, score updated
#   habits-01-empty.png      Habits tab, empty state
#   habits-02-add.png        add-habit form
#   habits-03-added.png      Habits tab with the new habit
#   dhikr-01.png             Dhikr counter, fresh
#   dhikr-02-counted.png     Dhikr counter after taps
#   progress-01.png          Progress tab (streak, score)
#   settings-01.png          Settings tab (light)
#   paywall-01.png           Paywall
#   settings-02-dark.png     Settings tab (dark mode)

# Fresh install state on every run
- launchApp:
    appId: "com.salahmate.app"
    clearState: true
- tapOn:
    text: "Wait"
    optional: true
- tapOn:
    text: "Close app"
    optional: true

# Cold boot on software-rendered emulator is slow and variable — allow 3 min
- extendedWaitUntil:
    visible: "Your day, anchored in prayer"
    timeout: 180000
    optional: true

# ================= Onboarding =================
- takeScreenshot: screenshots/onboarding-01.png
- assertVisible:
    text: "Your day, anchored in prayer"
    optional: true
- assertVisible:
    text: "Begin"
    optional: true
# Skip device location (falls back to Riyadh); avoids the system permission dialog
- tapOn:
    text: "Use my location for prayer times"
    optional: true
- tapOn:
    text: "Begin"
    optional: true
# Dismiss the Android location permission dialog if it still appears
- tapOn:
    text: "Don't allow"
    optional: true
- tapOn:
    text: "While using the app"
    optional: true

# ================= Today tab =================
- extendedWaitUntil:
    visible: "Next prayer"
    timeout: 60000
    optional: true
- takeScreenshot: screenshots/today-01.png
- assertVisible:
    text: "Today's prayers"
    optional: true
# Mark Fajr done (first prayer row; the habits hint below also mentions Fajr,
# but the prayer list renders first in the hierarchy)
- tapOn:
    text: "Fajr"
    optional: true
- assertVisible:
    text: "Today's score"
    optional: true
- takeScreenshot: screenshots/today-02-done.png

# ================= Habits tab =================
- tapOn:
    text: "Habits"
    optional: true
- assertVisible:
    text: "No habits yet"
    optional: true
- takeScreenshot: screenshots/habits-01-empty.png

- tapOn:
    text: "+ Add habit"
    optional: true
- assertVisible:
    text: "Habit (e.g. Read 2 pages)"
    optional: true
- takeScreenshot: screenshots/habits-02-add.png

- tapOn:
    text: "Habit (e.g. Read 2 pages)"
    optional: true
- inputText: "Read one page"
- hideKeyboard
- tapOn:
    text: "Save habit"
    optional: true
- assertVisible:
    text: "Read one page"
    optional: true
- takeScreenshot: screenshots/habits-03-added.png

# ================= Dhikr tab =================
- tapOn:
    text: "Dhikr"
    optional: true
- assertVisible:
    text: "Tap to count"
    optional: true
- takeScreenshot: screenshots/dhikr-01.png

- tapOn:
    text: "Tap to count"
    optional: true
- tapOn:
    text: "Tap to count"
    optional: true
- tapOn:
    text: "Tap to count"
    optional: true
- assertVisible:
    text: "Reset"
    optional: true
- takeScreenshot: screenshots/dhikr-02-counted.png

# ================= Progress tab =================
- tapOn:
    text: "Progress"
    optional: true
- assertVisible:
    text: "Perfect days in a row"
    optional: true
- takeScreenshot: screenshots/progress-01.png

# ================= Settings tab =================
- tapOn:
    text: "Settings"
    optional: true
- assertVisible:
    text: "Appearance"
    optional: true
- takeScreenshot: screenshots/settings-01.png
- assertVisible:
    text: "Get SalahMate Plus"
    optional: true
# ================= Paywall =================
- tapOn:
    text: "Get SalahMate Plus"
    optional: true
- assertVisible:
    text: "SalahMate Plus"
    optional: true
- takeScreenshot: screenshots/paywall-01.png
- assertVisible:
    text: "Start free trial"
    optional: true
# Back to Settings
- back

# ================= Dark mode =================
- tapOn:
    text: "Dark"
    optional: true
- takeScreenshot: screenshots/settings-02-dark.png
- assertVisible:
    text: "Dark"
    optional: true