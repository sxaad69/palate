appId: com.scrubdeck.app
---
# Full-coverage E2E: every screen, every major interactive state, screenshot
# after each significant state change.
#
# Screenshot map (13 total):
#   onboarding-01.png            "Know it cold for the exam"
#   onboarding-02.png            "Spaced repetition does the scheduling"
#   onboarding-03.png            "A few minutes a day" + Start studying
#   home-01.png                  Today tab: due cards, Start session
#   study-01-front.png           Study: card front, Tap to reveal
#   study-02-back.png            Study: card back + Again/Hard/Good/Easy
#   study-03-graded.png          next card after grading Good
#   decks-01.png                 Decks tab
#   decks-02-detail.png          Plus gate alert on New deck (custom decks are Plus)
#   progress-01.png              Progress tab: stats + mastery bars
#   settings-01.png              Settings tab (light)
#   paywall-01.png               Paywall
#   settings-02-dark.png         Settings tab (dark mode)

# Fresh install state on every run
- launchApp:
    appId: "com.scrubdeck.app"
    clearState: true
- tapOn:
    text: "Wait"
    optional: true
- tapOn:
    text: "Close app"
    optional: true

# Cold boot on software-rendered emulator is slow and variable — allow 3 min
- extendedWaitUntil:
    visible: "Know it cold for the exam"
    timeout: 180000
    optional: true

# ================= Onboarding (3 slides) =================
- takeScreenshot: screenshots/onboarding-01.png
- assertVisible:
    text: "Know it cold for the exam"
- tapOn:
    text: "→"
- assertVisible:
    text: "Spaced repetition does the scheduling"
- takeScreenshot: screenshots/onboarding-02.png

- tapOn:
    text: "→"
- assertVisible:
    text: "A few minutes a day"
- takeScreenshot: screenshots/onboarding-03.png

- tapOn:
    text: "Start studying"
# ================= Home (Today tab) =================
# Seed cards are due immediately (nextDue: now), so Start session renders
- assertVisible:
    text: "Today"
- assertVisible:
    text: "cards due"
- assertVisible:
    text: "Start session"
- takeScreenshot: screenshots/home-01.png

# ================= Study session =================
- tapOn:
    text: "Start session"
- assertVisible:
    text: "Tap to reveal"
- takeScreenshot: screenshots/study-01-front.png

- tapOn:
    text: "Tap to reveal"
- assertVisible:
    text: "Again"
- assertVisible:
    text: "Good"
- takeScreenshot: screenshots/study-02-back.png

# Grade Good — proves SM-2 scheduling advances to the next card
- tapOn:
    text: "Good"
- assertVisible:
    text: "Tap to reveal"
- takeScreenshot: screenshots/study-03-graded.png

# Close study (X) — returns to Home
- tapOn:
    text: "✕"
- assertVisible:
    text: "Today"
# ================= Decks tab =================
# NOTE: "Decks" matches both the Home section header and the bottom tab.
# The tab is the second match (index 1).
- tapOn:
    text: "Decks"
    index: 1
- assertVisible:
    text: "Fundamentals"
- takeScreenshot: screenshots/decks-01.png

# NOTE (corrected twice — runs 40021109539 + 40027815179): built-in
# deck rows do NOT open a detail view, and the deck detail ("Add
# card") exists only for CUSTOM decks — which are PLUS-gated:
# createDeck() pops a "Plus deck" alert for free users (screenshot:
# "Plus deck / Custom decks & cards", name typed, alert up). So for
# a free user the reachable Decks behaviour is: list renders, the
# create attempt hits the Plus gate, dismiss returns to the list.
- tapOn:
    text: "Deck name"
- inputText: "My Deck"
- hideKeyboard
# "New deck" matches the form title (index 0, inert) and the submit
# Button's Pressable (index 1) — tap the button.
- tapOn:
    text: "New deck"
    index: 1
- assertVisible:
    text: "Plus deck"
- assertVisible:
    text: "Custom decks & cards"
- takeScreenshot: screenshots/decks-02-detail.png

# Dismiss the gate alert — back on the deck list
- tapOn:
    text: "Later"
- assertVisible:
    text: "Fundamentals"
# ================= Progress tab =================
- tapOn:
    text: "Progress"
- assertVisible:
    text: "Total reviews"
- assertVisible:
    text: "day streak"
- assertVisible:
    text: "Mastery by deck"
- takeScreenshot: screenshots/progress-01.png

# ================= Settings tab =================
- tapOn:
    text: "Settings"
- assertVisible:
    text: "Settings"
- takeScreenshot: screenshots/settings-01.png
- assertVisible:
    text: "Go Plus"
# ================= Paywall =================
- tapOn:
    text: "Go Plus"
- assertVisible:
    text: "Start free trial"
- takeScreenshot: screenshots/paywall-01.png

# "Later" dismisses the paywall back to Settings
- tapOn:
    text: "Later"
- assertVisible:
    text: "Settings"
# ================= Dark mode =================
- tapOn:
    text: "Dark"
- takeScreenshot: screenshots/settings-02-dark.png
- assertVisible:
    text: "Dark"
# Restore light mode
- tapOn:
    text: "Light"
- assertVisible:
    text: "Settings"