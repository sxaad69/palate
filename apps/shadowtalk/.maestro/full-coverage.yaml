appId: com.shadowsay.app
---
# Full-coverage E2E: every screen, every major interactive state, screenshot
# after each significant state change.
#
# Screenshot map (13 total):
#   onboarding-01-lang.png            language pick: "ShadowSay"
#   onboarding-02-slide1.png           "Hear it like a native"
#   onboarding-03-slide2.png           "Shadow it out loud"
#   onboarding-04-slide3.png           "Compare and score"
#   onboarding-05-direction.png        direction pick, nothing selected
#   onboarding-06-direction-selected.png  "English → Arabic" selected
#   packs-01.png                      Packs tab (4 packs, Travel free)
#   practice-01-idle.png              Practice: phrase card, Play model + Record
#   practice-02-model-playing.png     after tapping Play model (TTS)
#   progress-01.png                   Progress tab
#   profile-01.png                    Profile tab (light)
#   paywall-01.png                    Paywall
#   profile-02-dark.png               Profile tab (dark mode)

# Fresh install state on every run
- launchApp:
    appId: "com.shadowsay.app"
    clearState: true
- tapOn:
    text: "Wait"
    optional: true
- tapOn:
    text: "Close app"
    optional: true

# Cold boot on software-rendered emulator is slow and variable — allow 3 min
- extendedWaitUntil:
    visible: "ShadowSay"
    timeout: 180000
    optional: true

# ================= Onboarding (5 steps) =================
- takeScreenshot: screenshots/onboarding-01-lang.png
- assertVisible:
    text: "ShadowSay"
- assertVisible:
    text: "Shadow. Speak. Sound native."
- assertVisible:
    text: "Pick your app language"
- tapOn:
    text: "Continue"
- assertVisible:
    text: "Hear it like a native"
- takeScreenshot: screenshots/onboarding-02-slide1.png

- tapOn:
    text: "Continue"
- assertVisible:
    text: "Shadow it out loud"
- takeScreenshot: screenshots/onboarding-03-slide2.png

- tapOn:
    text: "Continue"
- assertVisible:
    text: "Compare and score"
- takeScreenshot: screenshots/onboarding-04-slide3.png

- tapOn:
    text: "Continue"
- assertVisible:
    text: "Which direction will you practice?"
- takeScreenshot: screenshots/onboarding-05-direction.png

- tapOn:
    text: "English → Arabic"
- takeScreenshot: screenshots/onboarding-06-direction-selected.png

- tapOn:
    text: "Start practicing"
# ================= Packs tab =================
- assertVisible:
    text: "Travel"
- assertVisible:
    text: "Arabic for English Speakers"
- takeScreenshot: screenshots/packs-01.png

# Practice: free pack for en-ar direction is "Arabic for English Speakers"
- tapOn:
    text: "Arabic for English Speakers"
# NOTE: button titles are "🔊 Play model" and "🎙️ Record" (emoji prefixes
# in the same text node) — whole-text matching needs the .* prefix on both.
- assertVisible:
    text: ".*Play model"
- assertVisible:
    text: ".*Record"
- takeScreenshot: screenshots/practice-01-idle.png

# Play model uses on-device TTS — safe on emulator, no permission needed
- tapOn:
    text: ".*Play model"
- takeScreenshot: screenshots/practice-02-model-playing.png

# Close practice (X) — returns to Packs
- tapOn:
    text: "✕"
- assertVisible:
    text: "Travel"
# ================= Progress tab =================
- tapOn:
    text: "Progress"
- assertVisible:
    text: "day streak"
- takeScreenshot: screenshots/progress-01.png

# ================= Profile tab =================
- tapOn:
    text: "Profile"
- assertVisible:
    text: "Appearance"
- takeScreenshot: screenshots/profile-01.png
- assertVisible:
    text: "ShadowSay"
# ================= Paywall =================
- tapOn:
    text: "Go Pro"
- assertVisible:
    text: "Start free trial"
- takeScreenshot: screenshots/paywall-01.png

# "Maybe later" dismisses the paywall back to Profile
- tapOn:
    text: "Maybe later"
- assertVisible:
    text: "Appearance"
# ================= Dark mode =================
- tapOn:
    text: "Dark"
- takeScreenshot: screenshots/profile-02-dark.png
- assertVisible:
    text: "Dark"
# Restore light mode
- tapOn:
    text: "Light"
- assertVisible:
    text: "Appearance"